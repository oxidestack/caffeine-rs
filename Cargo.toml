[package]
name = "caffeine-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Unofficial Rust port of the eviction policy of Caffeine 3.1.8: W-TinyLFU admission window, SLRU segments, frequency sketch and hill climber"
repository = "https://github.com/oxidestack/caffeine-rs"
homepage = "https://oxidestack.github.io/caffeine-rs/"
documentation = "https://docs.rs/caffeine-rs"
readme = "README.md"
keywords = ["cache", "eviction", "tinylfu", "caffeine", "lru"]
categories = ["caching", "data-structures"]
# What crates.io gets: the library, its licence and notice, the README and the changelog. The pinned
# upstream sources, the tests and their recorded vectors, the tools, the docs and the site stay in the
# repository.
include = ["/src/**", "/LICENSE", "/NOTICE", "/README.md", "/CHANGELOG.md"]

[lib]
name = "caffeine"

[package.metadata.port]
upstream = "Caffeine"
upstream-versions = ["3.1.8"]

[dependencies]
